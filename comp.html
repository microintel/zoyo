<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ZOYO</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root {
  --bg: #f4f6f9; --card: #ffffff; --text: #000000; --border: #dddddd; --btn: #2ecc71; --btnHover: #27ae60;
}
body.dark { --bg: #121212; --card: #1e1e1e; --text: #ffffff; --border: #333; --btn: #3498db; --btnHover: #2980b9; }
body { margin:0; padding:10px; font-family:Arial,sans-serif; background:var(--bg); color:var(--text); transition:0.3s; }
.container { max-width:1000px; margin:auto; }
.top-bar { display:flex; justify-content:space-between; flex-wrap:wrap; margin-bottom:10px; }
.mode-btn { background:var(--btn); color:#fff; border:none; padding:10px 15px; border-radius:10px; cursor:pointer; }
table { width:100%; border-collapse:collapse; background:var(--card); border-radius:12px; overflow:hidden; font-size:14px; }
th, td { border:1px solid var(--border); padding:6px; text-align:center; }
th { background:#3498db; color:#fff; }
input { width:100%; max-width:70px; padding:5px; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text); }
.btn-group { text-align:center; margin-top:10px; display:flex; flex-wrap:wrap; justify-content:center; gap:8px; }
button { padding:10px 15px; border-radius:10px; border:none; background:var(--btn); color:#fff; font-size:14px; cursor:pointer; }
button:hover { background:var(--btnHover); }
.delete-btn { background:#e74c3c; }
canvas { background:var(--card); border-radius:15px; padding:10px; margin-top:10px; }
footer { text-align:center; margin-top:20px; font-size:12px; opacity:0.7; }
.color-picker { margin:0 5px; }
#highestMarks { margin-top:10px; font-weight:bold; text-align:center; }
#sumMarks { text-align:center; margin-top:10px; }
@media (max-width:600px) { th, td { font-size:12px; padding:4px; } button { font-size:12px; padding:8px 10px; } h3 { font-size:14px; }
}
</style>
</head>
<body class="light">
<div class="container">
<div class="top-bar">
  <div><h3>< COMP ></h3></div>
  <button class="mode-btn" onclick="toggleMode()">Dark / Light</button>
</div>

<div id="personsDiv" style="text-align:center; margin-bottom:10px;">
  P1 Name: <input id="p1Name" value="P1">
  <button onclick="removePerson('p1')">Remove</button>
  <input type="color" id="p1Color" class="color-picker" value="#ff6384" onchange="drawCharts()">
  P2 Name: <input id="p2Name" value="P2">
  <button onclick="removePerson('p2')">Remove</button>
  <input type="color" id="p2Color" class="color-picker" value="#36a2eb" onchange="drawCharts()">
</div>

<div style="text-align:center; margin-bottom:10px;">
  Add Person: <input id="newPersonName" placeholder="Enter Name">
  <input type="color" id="newPersonColor" value="#ffce56">
  <button onclick="addPerson()">Add</button>
</div>

<div style="text-align:center; margin-bottom:10px;">
  Graph Type:
  <select id="graphType" onchange="drawCharts()">
    <option value="bar">Bar (Column)</option>
    <option value="line">Line</option>
  </select>
</div>

<div style="text-align:center; margin-bottom:10px;">
  View Marks:
  <select id="viewPerson" onchange="updateTableView()"><option value="all">All</option></select>
</div>

<table>
  <thead>
    <tr id="tableHead">
      <th>Subject</th>
      <th>P1 CIE</th>
      <th>P1 SE</th>
      <th>P2 CIE</th>
      <th>P2 SE</th>
      <th>Delete</th>
    </tr>
  </thead>
  <tbody id="dataTable">
    <tr>
      <td><input value="C"></td>
      <td><input type="number" value="0"></td>
      <td><input type="number" value="0"></td>
      <td><input type="number" value="0"></td>
      <td><input type="number" value="0"></td>
      <td><button class="delete-btn" onclick="deleteRow(this)">X</button></td>
    </tr>
  </tbody>
</table>

<div id="highestMarks"></div>
<div id="sumMarks"></div>

<div class="btn-group">
  <button onclick="addRow()">Add Subject</button>
  <button onclick="exportData()">Export</button>
  <input type="file" id="importFile" hidden onchange="importData()">
  <button onclick="document.getElementById('importFile').click()">Import</button>
</div>

<h3>CIE Graph</h3>
<canvas id="cieChart"></canvas>
<h3>SE Graph</h3>
<canvas id="seChart"></canvas>
<h3>Total (CIE + SE)</h3>
<canvas id="totalChart"></canvas>

<footer>developed by microintel with ai</footer>
</div>

<script>
let db, cieChart, seChart, totalChart;
let persons=["p1","p2"];

const request=indexedDB.open("MarksDB",1);
request.onupgradeneeded=e=>{ db=e.target.result; db.createObjectStore("marks",{keyPath:"id"}); };
request.onsuccess=e=>{ db=e.target.result; loadData(); };

function addRow(){
  const row=document.createElement("tr");
  let cells=`<td><input></td>`;
  persons.forEach(p=>{ cells+=`<td><input type="number" value="0"></td><td><input type="number" value="0"></td>`; });
  cells+=`<td><button class="delete-btn" onclick="deleteRow(this)">X</button></td>`;
  row.innerHTML=cells;
  document.getElementById("dataTable").appendChild(row);
  attachAutoSave(row);
}

function deleteRow(btn){ btn.parentElement.parentElement.remove(); autoSave(); }

function autoSave(){
  const data=getTableData();
  const names={}; persons.forEach(p=>{ const ni=document.getElementById(p+"Name"); if(ni) names[p]=ni.value; });
  const colors={}; persons.forEach(p=>{ const ci=document.getElementById(p+"Color"); if(ci) colors[p]=ci.value; });
  const tx=db.transaction("marks","readwrite");
  tx.objectStore("marks").put({id:1,data,names,colors});
  drawCharts(); showHighestMarks(); showSumMarks(); updateTableView();
}

function getTableData(){
  const rows=document.querySelectorAll("#dataTable tr");
  return Array.from(rows).map(row=>{
    const i=row.querySelectorAll("input");
    const obj={subject:i[0].value}; let idx=1;
    persons.forEach(p=>{ obj[p+"_cie"]=+i[idx++].value; obj[p+"_se"]=+i[idx++].value; });
    return obj;
  });
}

function loadData(){
  const tx=db.transaction("marks","readonly");
  tx.objectStore("marks").get(1).onsuccess=e=>{
    if(!e.target.result) return;
    const data=e.target.result.data;
    const names=e.target.result.names;
    const colors=e.target.result.colors;
    Object.keys(names).forEach(p=>{
      if(!persons.includes(p)) addPersonByLoad(p,names[p], colors[p]||'#'+Math.floor(Math.random()*16777215).toString(16));
      else { document.getElementById(p+"Name").value=names[p]; if(colors[p]) document.getElementById(p+"Color").value=colors[p]; }
    });
    const tbody=document.getElementById("dataTable"); tbody.innerHTML="";
    data.forEach(d=>{
      const row=document.createElement("tr");
      let cells=`<td><input value="${d.subject}"></td>`;
      persons.forEach(p=>{ cells+=`<td><input type="number" value="${d[p+"_cie"]}"></td><td><input type="number" value="${d[p+"_se"]}"></td>`; });
      cells+=`<td><button class="delete-btn" onclick="deleteRow(this)">X</button></td>`;
      row.innerHTML=cells; tbody.appendChild(row); attachAutoSave(row);
    });
    drawCharts(); refreshPersonView(); showHighestMarks(); showSumMarks();
  };
}

function attachAutoSave(row){ row.querySelectorAll("input").forEach(i=>i.addEventListener("input",autoSave)); }

function addPerson(){
  const name=document.getElementById("newPersonName").value.trim();
  if(!name) return alert("Enter a name!");
  const color=document.getElementById("newPersonColor").value;
  const pId="p"+(persons.length+1); persons.push(pId);

  const th=document.createElement("th"); th.innerText=name+" CIE";
  const th2=document.createElement("th"); th2.innerText=name+" SE";
  const head=document.getElementById("tableHead");
  head.insertBefore(th, head.children[head.children.length-1]);
  head.insertBefore(th2, head.children[head.children.length-1]);

  document.querySelectorAll("#dataTable tr").forEach(row=>{
    const cieInput=document.createElement("input"); cieInput.type="number"; cieInput.value=0;
    const seInput=document.createElement("input"); seInput.type="number"; seInput.value=0;
    row.insertBefore(cieInput, row.children[row.children.length-1]);
    row.insertBefore(seInput, row.children[row.children.length-1]);
    cieInput.addEventListener("input", autoSave);
    seInput.addEventListener("input", autoSave);
  });

  const div=document.createElement("div"); div.id=pId+"Div";
  div.innerHTML=`${name}: <input id='${pId}Name' value='${name}' oninput='autoSave()'>
                   <button onclick="removePerson('${pId}')">Remove</button>
                   <input type="color" id='${pId}Color' class="color-picker" value='${color}' onchange='drawCharts()'>`;
  document.getElementById("personsDiv").appendChild(div);
  document.getElementById("newPersonName").value="";
  refreshPersonView(); drawCharts(); autoSave();
}

function removePerson(pId){
  if(persons.length<=1) return alert("At least one person required!");
  const idx=persons.indexOf(pId); if(idx!==-1) persons.splice(idx,1);
  document.getElementById(pId+"Div").remove();

  const head=document.getElementById("tableHead");
  for(let i=head.children.length-1;i>=0;i--){
    if(head.children[i].innerText.includes(pId+" CIE")||head.children[i].innerText.includes(pId+" SE")) head.children[i].remove();
  }
  document.querySelectorAll("#dataTable tr").forEach(row=>{
    for(let i=row.children.length-1;i>=0;i--){
      if(row.children[i].querySelector("input")) row.children[i].remove();
    }
  });
  refreshPersonView(); drawCharts(); autoSave();
}

function addPersonByLoad(pId,name,color){
  persons.push(pId);
  const th=document.createElement("th"); th.innerText=name+" CIE";
  const th2=document.createElement("th"); th2.innerText=name+" SE";
  const head=document.getElementById("tableHead");
  head.insertBefore(th, head.children[head.children.length-1]);
  head.insertBefore(th2, head.children[head.children.length-1]);

  const div=document.createElement("div"); div.id=pId+"Div";
  div.innerHTML=`${name}: <input id='${pId}Name' value='${name}' oninput='autoSave()'>
                   <button onclick="removePerson('${pId}')">Remove</button>
                   <input type="color" id='${pId}Color' class="color-picker" value='${color}' onchange='drawCharts()'>`;
  document.getElementById("personsDiv").appendChild(div);
}

function drawCharts(){
  const data=getTableData();
  const subjects=data.map(d=>d.subject);
  const graphType=document.getElementById("graphType").value;

  const datasetsCIE=persons.map(p=>{
    const color=document.getElementById(p+"Color").value;
    return {label:document.getElementById(p+"Name").value+" CIE", data:data.map(d=>d[p+"_cie"]), borderColor:color, backgroundColor:color, fill:false};
  });
  const datasetsSE=persons.map(p=>{
    const color=document.getElementById(p+"Color").value;
    return {label:document.getElementById(p+"Name").value+" SE", data:data.map(d=>d[p+"_se"]), borderColor:color, backgroundColor:color, fill:false};
  });
  const datasetsTotal=persons.map(p=>{
    const color=document.getElementById(p+"Color").value;
    return {label:document.getElementById(p+"Name").value+" Total", data:data.map(d=>d[p+"_cie"]+d[p+"_se"]), borderColor:color, backgroundColor:color, fill:false};
  });

  if(cieChart) cieChart.destroy(); if(seChart) seChart.destroy(); if(totalChart) totalChart.destroy();
  cieChart=new Chart(document.getElementById("cieChart"),{type:graphType,data:{labels:subjects,datasets:datasetsCIE}});
  seChart=new Chart(document.getElementById("seChart"),{type:graphType,data:{labels:subjects,datasets:datasetsSE}});
  totalChart=new Chart(document.getElementById("totalChart"),{type:graphType,data:{labels:subjects,datasets:datasetsTotal}});
}

function exportData(){ const tx=db.transaction("marks","readonly"); tx.objectStore("marks").get(1).onsuccess=e=>{ if(!e.target.result) return; const blob=new Blob([JSON.stringify(e.target.result)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="marks.json"; a.click(); }; }
function importData(){ const file=document.getElementById("importFile").files[0]; const reader=new FileReader(); reader.onload=()=>{ const data=JSON.parse(reader.result); const tx=db.transaction("marks","readwrite"); tx.objectStore("marks").put(data); tx.oncomplete=loadData; }; reader.readAsText(file); }
function toggleMode(){document.body.classList.toggle("dark");document.body.classList.toggle("light");}

// --- View Marks Feature ---
function updatePersonViewOptions(){
  const select=document.getElementById("viewPerson"); select.innerHTML='<option value="all">All</option>';
  persons.forEach(p=>{ const opt=document.createElement("option"); opt.value=p; opt.text=document.getElementById(p+"Name").value; select.appendChild(opt); });
}

function updateTableView(){
  const selected=document.getElementById("viewPerson").value;
  const head=document.getElementById("tableHead");
  const rows=document.querySelectorAll("#dataTable tr");
  persons.forEach(p=>{
    let cieIdx=-1, seIdx=-1;
    Array.from(head.children).forEach((th, idx)=>{ if(th.innerText===document.getElementById(p+"Name").value+" CIE") cieIdx=idx; if(th.innerText===document.getElementById(p+"Name").value+" SE") seIdx=idx; });
    if(cieIdx===-1||seIdx===-1) return;
    const display=(selected==="all"||selected===p)?"":"none";
    head.children[cieIdx].style.display=display; head.children[seIdx].style.display=display;
    rows.forEach(row=>{ row.children[cieIdx].style.display=display; row.children[seIdx].style.display=display; });
  });
  showSumMarks();
}

function refreshPersonView(){ updatePersonViewOptions(); updateTableView(); }

function showHighestMarks(){
  const data=getTableData(); const totals={}; persons.forEach(p=>{ totals[p]=data.reduce((sum,row)=>sum+row[p+"_cie"]+row[p+"_se"],0); });
  let max=-1,winner=""; for(const p in totals){ if(totals[p]>max){ max=totals[p]; winner=document.getElementById(p+"Name").value; } }
  document.getElementById("highestMarks").innerText="Highest Total Marks: "+winner+" ("+max+")";
}

function showSumMarks(){
  const data=getTableData(); const selected=document.getElementById("viewPerson").value; const sums={};
  persons.forEach(p=>{ if(selected!=="all" && selected!==p) return; sums[p]={cie:0,se:0,total:0}; data.forEach(r=>{ sums[p].cie+=r[p+"_cie"]; sums[p].se+=r[p+"_se"]; sums[p].total+=r[p+"_cie"]+r[p+"_se"]; }); });
  let html=""; for(const p in sums){ html+=`${document.getElementById(p+"Name").value}: CIE=${sums[p].cie}, SE=${sums[p].se}, Total=${sums[p].total}<br>`; }
  document.getElementById("sumMarks").innerHTML=html;
}

// Initialize on load
window.onload = function() {
  refreshPersonView(); // sets up view options and table visibility
  drawCharts();        // draw initial charts
  showHighestMarks();  // show initial highest scorer
  showSumMarks();      // show initial sums
};
</script>
</body>
</html>
